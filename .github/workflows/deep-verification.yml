name: Deep verification

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  resilience-load-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm acceptance:validate
      - name: Run isolated M12 load scenarios through the local verifier
        run: pnpm local:verify:deep
      - name: Retain deep-verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m12-deep-verification-${{ github.run_id }}
          path: load-artifacts
          if-no-files-found: warn
