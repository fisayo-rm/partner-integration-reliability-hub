name: Pull request

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  engineering-gate:
    name: Engineering gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: TypeScript compile
        run: pnpm typecheck
      - name: Test TypeScript compile
        run: pnpm test:typecheck
      - name: Architecture dependency test
        run: pnpm architecture
      - name: Unit tests
        run: pnpm test
      - name: Contract tests
        run: pnpm test -- tests/contracts
      - name: Security test gate
        run: pnpm test:security
      - name: Configuration bundle schema and exclusion scan
        run: pnpm config:verify
      - name: Explicit console production build
        run: pnpm --filter @pirh/console build
      - name: Lambda and CDK bundle build
        run: pnpm --filter @pirh/cdk synth
      - name: OpenAPI drift
        run: pnpm openapi:check
      - name: High-severity dependency audit
        run: pnpm audit
      - name: Source and configuration secret scan
        run: pnpm secret:scan
  compose-smoke:
    name: Compose build and smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Integration tests and default/observability Compose profiles
        run: pnpm local:verify
  container-scan:
    name: Container scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          {
            scan-type: fs,
            scan-ref: .,
            severity: HIGH,
            CRITICAL,
            exit-code: "1",
          }
  m11-hybrid-guard:
    name: M11 hybrid guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assert hybrid implementation stays deferred
        run: test ! -e infrastructure/hybrid
