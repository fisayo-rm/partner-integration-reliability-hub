name: Pull request

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  engineering-gate:
    name: Engineering gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: TypeScript compile
        run: pnpm typecheck
      - name: Test TypeScript compile
        run: pnpm test:typecheck
      - name: Architecture dependency test
        run: pnpm architecture
      - name: Unit tests
        run: pnpm test
      - name: Contract tests
        run: pnpm test -- tests/contracts
      - name: Security test gate
        run: pnpm test:security
      - name: Configuration bundle schema and exclusion scan
        run: pnpm config:verify
      - name: Explicit console production build
        run: pnpm --filter @pirh/console build
      - name: Lambda and CDK bundle build
        run: pnpm --filter @pirh/cdk synth
      - name: OpenAPI drift
        run: pnpm openapi:check
      - name: High-severity dependency audit
        run: pnpm audit
      - name: Source and configuration secret scan
        run: pnpm secret:scan
  compose-profile:
    name: Compose ${{ matrix.profile }} profile
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [default, observability]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Restore Playwright Chromium
        if: matrix.profile == 'default'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: matrix.profile == 'default'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build cached local worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.node
          tags: pirh-m01-node:local
          load: true
          cache-from: type=gha,scope=pirh-node-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=pirh-node-${{ matrix.profile }}
      - name: Build cached local console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.console
          tags: pirh-console:local
          load: true
          cache-from: type=gha,scope=pirh-console-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=pirh-console-${{ matrix.profile }}
      - name: Verify Compose profile
        run: PIRH_COMPOSE_SKIP_BUILD=1 pnpm local:verify:${{ matrix.profile }}
  compose-smoke:
    name: Compose build and smoke
    runs-on: ubuntu-24.04
    needs: compose-profile
    if: ${{ always() }}
    steps:
      - name: Require both complete Compose profiles
        env:
          COMPOSE_PROFILE_RESULT: ${{ needs.compose-profile.result }}
        run: test "$COMPOSE_PROFILE_RESULT" = success
  container-scan:
    name: Container scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
  m11-hybrid-guard:
    name: M11 hybrid safety guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Hybrid startup and IAM safety tests
        run: pnpm exec vitest run tests/config/hybrid.test.ts tests/cdk/hybrid-stack.test.ts
      - name: Hybrid CDK synthesis
        run: pnpm hybrid:synth
